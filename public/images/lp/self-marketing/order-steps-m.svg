<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 345 430" width="345" height="430" role="img" aria-labelledby="lp-i14m-t" font-family="'Pretendard Variable', Pretendard, sans-serif"><title id="lp-i14m-t">주문 화면 예시. 매장 정보 입력·광고 설정을 마치고 3단계 일정 설정에서 광고 기간 10일(인기)을 고른 모습. 마지막 4단계는 최종 확인</title>
<rect x=".5" y=".5" width="344" height="429" rx="12" fill="#FFFFFF" stroke="#D5D7DC"/>
<text x="20" y="38" font-size="20" font-weight="700" fill="#000000">광고 시작하기</text>
<rect x="253" y="16" width="72" height="24" fill="#000000"/>
<text x="289" y="33" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">예시 화면</text>
<path d="M34 74V212" stroke="#E6E7EA" stroke-width="2"/>
<rect x="12" y="143" width="321" height="46" fill="#1E3AFF" fill-opacity=".08"/><rect x="12" y="143" width="3" height="46" fill="#1E3AFF"/>
<circle cx="34" cy="74" r="13" fill="#1E3AFF"/><path d="M27.500 74.5l4.500 4.500 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="72" font-size="16" font-weight="600" fill="#1A1C20">매장 정보 입력</text><text x="60" y="88" font-size="12" font-weight="500" fill="#6B7079">매장의 기본 정보를 입력하세요</text>
<circle cx="34" cy="120" r="13" fill="#1E3AFF"/><path d="M27.500 120.5l4.500 4.500 8-9" fill="none" stroke="#FFFFFF" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
<text x="60" y="118" font-size="16" font-weight="600" fill="#1A1C20">광고 설정</text><text x="60" y="134" font-size="12" font-weight="500" fill="#6B7079">광고 옵션을 설정하세요</text>
<circle cx="34" cy="166" r="13" fill="#1E3AFF"/><text x="34" y="171.500" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text>
<text x="60" y="164" font-size="16" font-weight="800" fill="#000000">일정 설정</text><text x="60" y="180" font-size="12" font-weight="500" fill="#3A3D44">광고 일정을 설정하세요</text>
<circle cx="34" cy="212" r="12.500" fill="#FFFFFF" stroke="#D5D7DC" stroke-width="1.500"/><text x="34" y="217.500" font-size="15" font-weight="700" fill="#6B7079" text-anchor="middle">4</text>
<text x="60" y="210" font-size="16" font-weight="600" fill="#6B7079">최종 확인</text><text x="60" y="226" font-size="12" font-weight="500" fill="#6B7079">입력한 정보를 확인하세요</text>
<rect x="20" y="246" width="305" height="8" rx="4" fill="#E6E7EA"/><rect x="20" y="246" width="229" height="8" rx="4" fill="#1E3AFF"/>
<text x="20" y="278" font-size="15" font-weight="700" fill="#1A1C20">광고 기간</text>
<rect x="20.500" y="298.500" width="95" height="43" rx="6" fill="#FFFFFF" stroke="#D5D7DC"/>
<rect x="124.500" y="298.500" width="95" height="43" rx="6" fill="#FFFFFF" stroke="#D5D7DC"/>
<rect x="228.500" y="298.500" width="95" height="43" rx="6" fill="#FFFFFF" stroke="#D5D7DC"/>
<rect x="20.750" y="298.750" width="94.500" height="42.500" rx="6" fill="#1E3AFF" fill-opacity=".08" stroke="#1E3AFF" stroke-width="1.500"/>
<rect x="28" y="287" width="44" height="22" rx="11" fill="#1E3AFF"/>
<text x="50" y="302.500" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">인기</text>
<path d="M30 324l4.500 4.500 8-9" fill="none" stroke="#1E3AFF" stroke-width="2.500" stroke-linecap="round" stroke-linejoin="round"/>
<g font-size="17" font-weight="700"><text x="50" y="326" fill="#000000">10일</text><text x="172" y="326" fill="#3A3D44" text-anchor="middle">20일</text><text x="276" y="326" fill="#3A3D44" text-anchor="middle">30일</text></g>
<text x="20" y="364" font-size="12" font-weight="500" fill="#6B7079">등록한 광고는 다음 날부터 진행됩니다.</text>
<rect x="20" y="376" width="145" height="36" rx="6" fill="#E6E7EA"/><rect x="180" y="376" width="145" height="36" rx="6" fill="#1E3AFF"/>
<g font-size="16" font-weight="700" text-anchor="middle"><text x="92.500" y="399" fill="#3A3D44">이전</text><text x="252.500" y="399" fill="#FFFFFF">다음</text></g>
</svg>
